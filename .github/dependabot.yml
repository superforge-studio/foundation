# Dependabot opens a pull request a month for what's out of date: one for
# GitHub's actions, one for the dependencies' minor and patch releases, and
# one each for a major release, which may need code changes. Each runs CI
# like any PR, so it merges only once `check` passes on it. A security fix
# comes as soon as there is one, once Dependabot security updates are on in
# the repository's settings (Settings → Code security).
#
# `@superforge/infra` is never offered: the app's code speaks one release
# of it, so it moves only with the template's code that speaks the next
# (in a copy, by an update from the template). In a copy, a Dependabot bump
# of a dependency the template lists is overruled by the template's version
# at the next update (workbench/updating.md, "package.json").
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      groups:
          actions:
              patterns: ["*"]

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      ignore:
          - dependency-name: "@superforge/infra"
      groups:
          dependencies:
              patterns: ["*"]
              update-types: [minor, patch]
