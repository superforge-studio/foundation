# Checks every pull request and every push to main, and applies the Railway
# project's configuration. Railway deploys each push to main itself, once this
# whole workflow has passed on it (`checkSuites` in .railway/railway.ts), so
# a push's configuration is applied before its code deploys, and a push
# whose check or apply fails doesn't deploy.
#
# `check` is the gate: it passes once `code` and every shard of `tests`
# have, which between them run `pnpm check` (workbench/scripts/check.sh), so
# a branch that passes it on a laptop passes it here. `code` is biome, the
# migration check (the journal and squawk), typecheck, the production build
# (which runs the prerender) and the smoke test (the build migrated, started
# and probed as Railway runs it); `tests` is the tests in two shards, on a
# Postgres of each runner's own, which `pnpm install` brings
# (source/database/local/), the upgrade test among them (the PR's migrations
# over the base branch's, on a database with rows in it). They run side by
# side. A failure shows on the PR and the commit, and an agent can read the
# full log with `gh run view <id> --log-failed`.
#
# `railway-apply` applies .railway/railway.ts on each push, after `check`,
# with one repository secret, RAILWAY_TOKEN: a project token for the
# `production` environment. It's the only job that gets it, so only merged
# code runs with it: a project token can do anything in its environment,
# reading production's secrets among it, and a job on a PR runs the PR's own
# code. The apply refuses a destructive change (deleting a service, a volume
# or a variable), which a human applies by hand
# (workbench/commit-and-deploy.md, "CI and deploys"). Until the secret is
# set, the apply skips with a notice rather than failing, so a new copy's
# first pushes pass before it has a Railway project.
#
# `release-tag` tags each of the template's releases once it reaches main,
# after `check`. A release is the push that changes the version in
# .superforge/superforge.json, and copies update from its tag, `v` and the
# version (workbench/updating.md), so the release is out once the tag is.
# A version already tagged is left as it is. Only the template runs it: a
# copy's version says which template release it's on, not a release of its
# own, so a copy skips it.
name: CI

on:
    pull_request:
    push:
        branches: [main]

# What every job's GITHUB_TOKEN may do: read the code, nothing more.
# `release-tag` alone may write, to push its tag.
permissions:
    contents: read

# A new push to a PR's branch stops the run on the push before it, which can
# no longer merge. Pushes to main each run to the end, in order, since each
# one deploys.
concurrency:
    group: ci-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    code:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  # `engines.node` in package.json, as Railway reads it
                  node-version-file: package.json
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: workbench/scripts/check.sh code

    tests:
        strategy:
            # Every shard runs to the end, so one run shows every failure
            fail-fast: false
            matrix:
                shard: [1/2, 2/2]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  # `engines.node` in package.json, as Railway reads it
                  node-version-file: package.json
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: workbench/scripts/check.sh tests ${{ matrix.shard }}
              env:
                  # The upgrade test's base: the PR's, or main on a push
                  UPGRADE_FROM: origin/${{ github.base_ref || 'main' }}

    check:
        needs: [code, tests]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        steps:
            - name: Whether the code and the tests passed
              run: |
                  if [ "$CODE" = success ] && [ "$TESTS" = success ]; then
                      echo "The code and every shard of the tests passed"
                  else
                      echo "::error::code: $CODE, tests: $TESTS"
                      exit 1
                  fi
              env:
                  CODE: ${{ needs.code.result }}
                  TESTS: ${{ needs.tests.result }}

    # Applies .railway/railway.ts on each push, once `check` passes, against
    # the live project as it stands then. Without --confirm-destructive it
    # fails on a destructive change, so Railway skips deploying the push.
    railway-apply:
        needs: check
        if: ${{ !cancelled() && github.event_name == 'push' && needs.check.result == 'success' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # One at a time, in push order
        concurrency:
            group: railway-config
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  # `engines.node` in package.json, as Railway reads it
                  node-version-file: package.json
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: npm install --global @railway/cli@5.71.0
            # Skips without the secret, which a new copy doesn't have until
            # its owner sets Railway up (workbench/commit-and-deploy.md,
            # "Setting up Railway"). Once Railway is set up, a push that
            # skips here deploys without its configuration applied, so the
            # secret stays set; a token that's revoked or expired still
            # fails the apply, and Railway deploys nothing.
            - name: Apply .railway/railway.ts
              run: |
                  if [ -z "$RAILWAY_TOKEN" ]; then
                      echo "::notice::Skipped: the RAILWAY_TOKEN secret isn't set yet. Set a project token for Railway's production environment to apply .railway/railway.ts on each push."
                      exit 0
                  fi
                  railway config apply --yes
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    # Tags the release in the version file, if it isn't tagged yet, on the
    # commit on main that set that version: a run that comes late, after
    # another push or a failure, still tags the release itself.
    release-tag:
        needs: check
        if: ${{ !cancelled() && github.event_name == 'push' && github.event.repository.is_template && needs.check.result == 'success' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        # Pushing the tag is the one write any job makes to the repository
        permissions:
            contents: write
        # One at a time, so two pushes never race to make the same tag
        concurrency:
            group: release-tag
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7
              with:
                  # Every commit, to find the one that set the version
                  fetch-depth: 0
            # The agent that updates a copy reads a release's notes before it
            # takes it, so a version without its notes file, headed with it,
            # and its line in CHANGELOG.md fails here rather than going out
            # without them.
            - name: Tag the release, if it isn't yet
              run: |
                  version=$(jq -r .version .superforge/superforge.json)
                  tag="v$version"
                  notes=".superforge/releases/$version.md"
                  if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
                      echo "$tag is already tagged"
                      exit 0
                  fi
                  if [ ! -f "$notes" ] || ! head -n 1 "$notes" | grep -qF -- "# $version ("; then
                      echo "::error::.superforge/superforge.json says $version, but $notes doesn't start with \"# $version (day)\", so $tag isn't tagged. Give the release its notes, and the next push to main tags it."
                      exit 1
                  fi
                  if ! grep -qF -- "- [$version]($notes)" CHANGELOG.md; then
                      echo "::error::CHANGELOG.md has no line for $version (\"- [$version]($notes) (day): …\"), so $tag isn't tagged. Add it, and the next push to main tags it."
                      exit 1
                  fi
                  release=$(git log --first-parent -n 1 --format=%H HEAD -- .superforge/superforge.json)
                  git config user.name "github-actions[bot]"
                  git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
                  git tag -a "$tag" -m "$tag" "$release"
                  git push origin "refs/tags/$tag"
                  echo "::notice::Tagged $tag on $(git log -n 1 --format='%h %s' "$release")"
